# ─────────────────────────────────────────────
# DATASOURCE
# ─────────────────────────────────────────────
# The JDBC URL tells Spring/Hibernate:
#   - which driver to use (mysql)
#   - where the server is (localhost:3306)
#   - which database to connect to (sms_db)
#
# createDatabaseIfNotExist=true  → MySQL will create 'sms_db' automatically
#   if it doesn't exist yet, so you don't need to manually run CREATE DATABASE.
spring.datasource.url=jdbc:mysql://localhost:3306/sms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────
# JPA / HIBERNATE
# ─────────────────────────────────────────────
# hibernate.ddl-auto controls schema generation:
#   - 'create'      → drops and recreates tables every startup (wipes data!)
#   - 'create-drop' → drops tables on shutdown too
#   - 'update'      → adds new columns/tables but never drops (use in dev)
#   - 'validate'    → checks schema matches entities, throws if mismatch
#   - 'none'        → do nothing (use in production with Flyway/Liquibase)
#
# We use 'update' during development so Hibernate creates the table on first
# run and safely adds columns later if we change the entity.
spring.jpa.hibernate.ddl-auto=update

# The dialect tells Hibernate which SQL flavour to generate.
# Spring Boot 3 auto-detects this from the driver, but being explicit is fine.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# show-sql=true prints every SQL query Hibernate executes to the console.
# Very useful for learning – you can see exactly what JPA generates.
spring.jpa.show-sql=true

# format_sql=true makes the printed SQL human-readable (multi-line, indented).
spring.jpa.properties.hibernate.format_sql=true

# ─────────────────────────────────────────────
# APPLICATION
# ─────────────────────────────────────────────
spring.application.name=student-management-system
server.port=8080
